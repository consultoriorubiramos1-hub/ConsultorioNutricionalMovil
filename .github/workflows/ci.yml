name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: ['release/**']
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: America/Mexico_City
  EXPO_NO_TELEMETRY: 1

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar flujo de ramas
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          node <<'NODE'
          const e=process.env;
          const base=e.BASE||'';
          const head=e.HEAD||'';
          const labels=JSON.parse(e.LABELS||'[]');
          const hotfix=head.startsWith('fix/hotfix-')&&labels.includes('hotfix-approved');
          if(base==='develop' && !/^(feature|fix|chore|release)\//.test(head)) { console.error('develop solo recibe feature/, fix/, chore/ y release/.'); process.exit(1); }
          if(base.startsWith('release/') && !/^(fix|chore)\//.test(head)) { console.error('La rama release solo recibe fixes y tareas de preparacion.'); process.exit(1); }
          if(base==='main' && !(/^release\/v[0-9]+\.[0-9]+\.[0-9]+$/.test(head)||hotfix)) { console.error('main solo recibe release/vX.Y.Z o un hotfix autorizado.'); process.exit(1); }
          NODE

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:config

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p test-results
      - run: npm run test:unit:jest -- --ci --coverage --json --outputFile=test-results/unit.json
      - name: Ejecutar las cuatro suites existentes
        if: ${{ !cancelled() }}
        run: npm run test:legacy
      - name: Conservar resultados incluso con fallos
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-results
          path: |
            test-results/
            coverage/unit/
          if-no-files-found: error
          retention-days: 14

  integration-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p test-results
      - run: npm run test:integration:mock -- --ci --coverage --json --outputFile=test-results/integration-mock.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-mock-results
          path: |
            test-results/
            coverage/integration-mock/
          if-no-files-found: error
          retention-days: 14

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [branch-policy, typecheck, lint, unit-tests, integration-mock]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir éxito real de todos los jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jobs = Object.entries(JSON.parse(process.env.RESULTS));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '| Validación | Resultado |\n|---|---|\n' + jobs.map(([name, job]) => `| ${name} | ${job.result} |`).join('\n') + '\n');
          if (jobs.length !== 5 || jobs.some(([, job]) => job.result !== 'success')) {
            console.error('CI bloqueado: fallo, cancelación u omisión de una comprobación obligatoria.');
            process.exit(1);
          }
          NODE
