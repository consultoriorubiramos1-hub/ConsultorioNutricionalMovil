name: Android - pruebas internas (manual)

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID exitoso de Android AAB y tag tras integrar release
        required: true
        type: string
      version:
        description: Version del AAB conservado (X.Y.Z)
        required: true
        type: string
      confirmation:
        description: Autorizacion explicita
        required: true
        type: choice
        options: [CANCELAR, ENVIAR_A_PRUEBAS_INTERNAS]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: android-internal
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
      ANDROID_RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
      RELEASE_APPROVALS_CONFIGURED: ${{ vars.RELEASE_APPROVALS_CONFIGURED }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_VERSION: ${{ inputs.version }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - name: Exigir autorizacion antes de descargar o enviar
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$ANDROID_RELEASE_ENABLED" = true
          test "$RELEASE_APPROVALS_CONFIGURED" = true
          test "$RELEASE_CONFIRMATION" = ENVIAR_A_PRUEBAS_INTERNAS
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Seleccionar AAB de la ejecucion automatica exitosa
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/android-release.cjs select-build-artifact
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release
          merge-multiple: true
      - name: Verificar procedencia, tag, EAS y SHA-256
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/android-release.cjs verify-submission
      - name: Enviar unicamente el build seleccionado al canal interno
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: npx eas-cli@latest submit --platform android --profile internal --id "$BUILD_ID" --non-interactive --wait
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-internal-${{ github.run_id }}
          path: |
            release/app.aab
            release/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Registrar pendiente de instalacion y pruebas
        run: echo 'AAB enviado al canal interno. Instalar, probar y adjuntar evidencia antes de autorizar android-promote.' >> "$GITHUB_STEP_SUMMARY"
